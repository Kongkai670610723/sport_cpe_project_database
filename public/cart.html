<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page — SPORT.CPE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f1f5f9] min-h-screen flex flex-col">

    <header class="bg-[#0b1329] text-white">
        <div class="max-w-[1280px] mx-auto px-6 h-[72px] flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-2 font-black text-xl tracking-wider text-white hover:opacity-90 italic">
                <img src="images/logo_sport_cpe.png" alt="SPORT.CPE Logo" class="w-9 h-9 object-contain shrink-0"> SPORT.CPE
            </a>

            <div class="flex-1 max-w-[500px] hidden md:block">
                <div class="relative">
                    <input 
                        type="text" 
                        id="global-search-input"
                        placeholder="Search equipment, shoes, gear..." 
                        class="w-full bg-[#1e293b] text-white placeholder-slate-400 text-xs rounded-lg pl-9 pr-4 py-2.5 border border-slate-700 focus:outline-none focus:border-[#ff6b00]"
                        onkeydown="if(event.key==='Enter'){ window.location.href='products.html?search='+encodeURIComponent(this.value); }"
                    >
                    <span class="absolute left-3 top-2.5 text-xs text-slate-400">🔍</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <a href="cart.html" class="flex items-center gap-2 bg-[#22c55e] hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-xs transition shadow-sm">
                    <span>🛒 Cart (<span id="cart-badge-count">0</span>)</span>
                </a>
                <div id="nav-auth-area" class="flex items-center gap-2">
                    <a href="login.html" class="flex items-center gap-1.5 border border-slate-400 hover:border-white px-4 py-1.5 rounded-lg text-xs font-semibold text-white transition">
                        <span>👤 Login</span>
                    </a>
                </div>
            </div>
        </div>

        <nav class="border-t border-slate-800 text-xs font-medium">
            <div class="max-w-[1280px] mx-auto px-6 flex items-center gap-8 h-11 overflow-x-auto whitespace-nowrap" id="main-cat-nav">
                <a href="index.html" data-cat="home" class="py-2.5 transition text-[#ff6b00] font-bold border-b-2 border-[#ff6b00]">Home</a>
                <a href="products.html?category=running" data-cat="running" class="py-2.5 transition text-slate-300 hover:text-white">Running</a>
                <a href="products.html?category=badminton" data-cat="badminton" class="py-2.5 transition text-slate-300 hover:text-white">Badminton</a>
                <a href="products.html?category=basketball" data-cat="basketball" class="py-2.5 transition text-slate-300 hover:text-white">Basketball</a>
                <a href="products.html?category=football" data-cat="football" class="py-2.5 transition text-slate-300 hover:text-white">Football</a>
                <a href="products.html?category=swim" data-cat="swim" class="py-2.5 transition text-slate-300 hover:text-white">Swim</a>
                <a href="products.html?category=fitness" data-cat="fitness" class="py-2.5 transition text-slate-300 hover:text-white">Fitness</a>
                <a href="products.html?category=camping" data-cat="camping" class="py-2.5 transition text-slate-300 hover:text-white">Camping</a>
                <a href="products.html?category=volleyball" data-cat="volleyball" class="py-2.5 transition text-slate-300 hover:text-white">Volleyball</a>
            </div>
        </nav>
    </header>

    <main class="max-w-[1140px] w-full mx-auto px-6 py-6 flex-1">
        <!-- Breadcrumb -->
        <div class="text-xs text-slate-400 font-medium mb-4 flex items-center gap-2">
            <a href="index.html" class="hover:text-slate-700">Home</a> <span>&gt;</span> <span class="text-slate-700 font-semibold">Cart Page</span>
        </div>

        <h1 class="text-3xl font-black text-slate-900 mb-6 tracking-tight">YOUR CART</h1>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
            <!-- Left: Dynamic Cart Items inside ONE White Card (Matching Figma Frame 7) -->
            <div id="cart-items-container" class="md:col-span-8 bg-white rounded-3xl p-6 border border-slate-200/90 shadow-sm divide-y divide-slate-200/80">
            </div>

            <!-- Right: Dynamic Order Summary Card (Matching Figma Frame 7) -->
            <div class="md:col-span-4 bg-white rounded-3xl p-6 border border-slate-200/90 shadow-sm">
                <h2 class="font-bold text-slate-900 text-lg mb-4">Order Summary</h2>

                <div class="space-y-3 text-sm border-b border-slate-200 pb-4 mb-4">
                    <div class="flex justify-between text-slate-600">
                        <span>Subtotal</span>
                        <span id="summary-subtotal" class="font-bold text-slate-900">฿0</span>
                    </div>
                    <div class="flex justify-between text-[#e11d48] font-medium" id="summary-discount-row">
                        <span id="summary-discount-label">Discount</span>
                        <span id="summary-discount-val" class="font-bold">-฿0</span>
                    </div>
                    <div class="flex justify-between text-slate-600">
                        <span>Delivery Fee</span>
                        <span id="summary-delivery" class="font-bold text-slate-900">Free</span>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-5">
                    <span class="font-bold text-slate-900 text-base">Total</span>
                    <span id="summary-total" class="text-2xl font-black text-slate-900">฿0</span>
                </div>

                <!-- Promo Code Input & Apply Button -->
                <div class="flex items-center gap-2 mb-2">
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-2.5 text-slate-400 text-xs">🏷️</span>
                        <input 
                            type="text" 
                            id="promo-code-input"
                            placeholder="Add promo code" 
                            class="w-full border border-slate-300 rounded-xl pl-8 pr-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-slate-800 uppercase"
                            onkeydown="if(event.key==='Enter'){ applyPromoCode(); }"
                        >
                    </div>
                    <button onclick="applyPromoCode()" class="bg-[#0b1329] hover:bg-slate-800 text-white font-bold px-5 py-2 rounded-xl text-xs transition shrink-0">
                        Apply
                    </button>
                </div>

                <!-- Promo Feedback Message & Quick Voucher Pills -->
                <div id="promo-feedback" class="text-[11px] font-semibold mb-3 hidden"></div>
                <div id="collected-vouchers-bar" class="mb-5 text-[11px] text-slate-500"></div>

                <button onclick="proceedToCheckout()" class="w-full bg-[#0b1329] hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-sm">
                    <span>Go to Checkout →</span>
                </button>
            </div>
        </div>
    </main>

    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>
    <script>
      function renderCartPage() {
        const currentUser = STATE.getCurrentUser();
        if (!currentUser) {
          window.location.href = 'login.html?auth_required=1';
          return;
        }
        const summary = STATE.calculateCartSummary();
        const container = document.getElementById('cart-items-container');

        if (summary.cart.length === 0) {
          container.innerHTML = `
            <div class="py-12 text-center">
                <div class="text-4xl mb-3">🛒</div>
                <h3 class="text-base font-bold text-slate-800 mb-1">ตะกร้าสินค้าของคุณยังว่างอยู่</h3>
                <p class="text-xs text-slate-500 mb-5">เลือกซื้ออุปกรณ์กีฬาคุณภาพจากหน้าแรกหรือหมวดหมู่สินค้าได้เลย</p>
                <div class="flex items-center justify-center gap-3">
                    <a href="index.html" class="bg-[#0b1329] text-white font-bold px-5 py-2.5 rounded-xl text-xs">ไปเลือกซื้อสินค้า →</a>
                </div>
            </div>
          `;
        } else {
          container.innerHTML = summary.cart.map(item => {
            // Fix #1 & #2: Same GREEN badge ONLY on products in promotion_products (promo_id=3)
            // Buying every 2 units automatically grants +1 FREE unit (free_qty = Math.floor(qty / 2))
            let promoBadge = '';
            if (item.promo_eligible) {
              if (item.free_qty > 0) {
                promoBadge = `<div class="mt-1.5"><span class="inline-block bg-[#dcfce7] text-[#166534] border border-green-300 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">🎁 Buy 2 Get 1 Free Eligible • ซื้อ ${item.quantity} ชิ้น แถมฟรีเพิ่ม ${item.free_qty} ชิ้นอัตโนมัติ! (รวมได้รับสินค้า ${item.total_received_qty} ชิ้น • ส่วนลดของแถม -฿${item.item_discount.toLocaleString()})</span></div>`;
              } else {
                const needMore = 2 - (item.quantity % 2);
                promoBadge = `<div class="mt-1.5"><span class="inline-block bg-[#dcfce7] text-[#166534] border border-green-300 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">🎁 Buy 2 Get 1 Free Eligible (ซื้อชิ้นนี้เพิ่มอีก ${needMore} ชิ้น ครบ 2 ชิ้น รับแถมฟรีเพิ่ม 1 ชิ้นอัตโนมัติ!)</span></div>`;
              }
            }
            return `
            <div class="py-5 first:pt-1 last:pb-1 flex items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <a href="product-detail.html?id=${item.id}" class="w-24 h-24 rounded-2xl bg-[#f1f5f9] flex items-center justify-center p-2.5 shrink-0 border border-slate-200/60 hover:opacity-90 transition">
                        <img src="${item.image}" alt="${item.name}" class="max-h-full max-w-full object-contain">
                    </a>
                    <div>
                        <a href="product-detail.html?id=${item.id}" class="font-bold text-slate-900 text-base hover:text-[#ff6b00] transition">${item.name}</a>
                        <p class="text-xs text-slate-500 mt-0.5">Brand: ${item.brand} | Category: ${item.category}</p>
                        ${promoBadge}
                        <div class="flex items-baseline gap-2 mt-2">
                            <span class="font-extrabold text-slate-900 text-lg">฿${item.price.toLocaleString()}</span>
                            ${item.free_qty > 0
                              ? `<span class="text-xs text-slate-500 font-medium">(ซื้อ ${item.quantity} ชิ้น + <strong class="text-[#16a34a]">แถมฟรี ${item.free_qty} ชิ้น</strong> = รวมรับ ${item.total_received_qty} ชิ้น | จ่ายเพียง <strong class="text-[#166534]">฿${item.line_net_total.toLocaleString()}</strong>)</span>`
                              : (item.quantity > 1 ? `<span class="text-xs text-slate-500 font-medium">(รวม ${item.quantity} ชิ้น: ฿${item.line_net_total.toLocaleString()})</span>` : '')
                            }
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-end justify-between self-stretch py-0.5">
                    <button onclick="handleRemoveItem(${item.id})" title="ลบสินค้าออกจากตะกร้า" class="w-7 h-7 rounded-full bg-red-50 hover:bg-red-100 text-red-500 hover:text-red-700 flex items-center justify-center text-xs transition">
                        🗑️
                    </button>
                    <div class="flex items-center border border-slate-300 rounded-full px-3 py-1 text-xs font-bold bg-white shadow-sm gap-3 select-none">
                        <button onclick="handleQtyChange(${item.id}, -1)" class="text-slate-500 hover:text-black text-sm px-1 font-extrabold">−</button>
                        <span class="text-slate-900 min-w-[16px] text-center">${item.quantity}</span>
                        <button onclick="handleQtyChange(${item.id}, 1)" class="text-slate-500 hover:text-black text-sm px-1 font-extrabold">+</button>
                    </div>
                </div>
            </div>
          `;
          }).join('');
        }

        // Update Summary Numbers
        document.getElementById('summary-subtotal').textContent = '฿' + summary.subtotal.toLocaleString();
        document.getElementById('summary-discount-label').textContent = summary.discountTitle;
        document.getElementById('summary-discount-val').textContent = '-฿' + summary.totalDiscount.toLocaleString();
        document.getElementById('summary-delivery').textContent = summary.deliveryFee;
        document.getElementById('summary-total').textContent = '฿' + summary.netTotal.toLocaleString();

        const promoInput = document.getElementById('promo-code-input');
        if (summary.appliedCode && !promoInput.value) {
          promoInput.value = summary.appliedCode;
        }

        const vouchers = STATE.getVouchers();
        const vBar = document.getElementById('collected-vouchers-bar');
        const activeCode = summary.appliedCode && !summary.promoError ? summary.appliedCode : '';
        if (vouchers.length === 0) {
          vBar.innerHTML = `
            <div class="flex flex-wrap items-center justify-between gap-1.5 mt-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <span class="text-slate-600">คุณยังไม่มีโค้ดส่วนลดที่เก็บไว้</span>
                <a href="vouchers.html" class="text-[#ff6b00] hover:underline font-bold">[ 🏷️ ไปหน้าเก็บโค้ดส่วนลด → ]</a>
            </div>
            <div class="text-[10px] text-slate-400 mt-1">* สินค้าที่มีป้ายสีเขียว 🎁 Buy 2 Get 1 Free เมื่อซื้อชิ้นเดียวกันครบทุกๆ 2 ชิ้น ระบบแถมฟรีเพิ่มให้ 1 ชิ้นอัตโนมัติ</div>
          `;
        } else {
          vBar.innerHTML = `
            <div class="flex flex-wrap items-center gap-1.5 mt-1">
                <span>โค้ดที่คุณเก็บไว้:</span>
                ${vouchers.map(code => `
                  <button onclick="quickSelectPromo('${code}')" class="px-2.5 py-0.5 rounded-lg border text-[10px] font-bold transition ${activeCode === code ? 'bg-[#ff6b00] text-white border-[#ff6b00]' : 'bg-green-50 text-green-800 border-green-300 hover:border-green-600'}">
                      ${code} ✓
                  </button>
                `).join('')}
                <a href="vouchers.html" class="text-[#ff6b00] hover:underline text-[10px] font-bold ml-1">[+ เก็บโค้ดเพิ่ม]</a>
                ${activeCode ? `<button onclick="clearPromoCode()" class="text-red-500 hover:underline text-[10px] font-bold ml-1">[ยกเลิกโค้ด]</button>` : ''}
            </div>
            <div class="text-[10px] text-slate-400 mt-1">* สินค้าที่มีป้ายสีเขียว 🎁 Buy 2 Get 1 Free เมื่อซื้อชิ้นเดียวกันครบทุกๆ 2 ชิ้น ระบบแถมฟรีเพิ่มให้ 1 ชิ้นอัตโนมัติ</div>
          `;
        }
      }

      function handleQtyChange(productId, delta) {
        STATE.updateCartQty(productId, delta);
        renderCartPage();
      }

      function handleRemoveItem(productId) {
        STATE.removeFromCart(productId);
        renderCartPage();
      }

      function quickSelectPromo(code) {
        document.getElementById('promo-code-input').value = code;
        applyPromoCode();
      }

      function clearPromoCode() {
        STATE.setAppliedPromo('');
        document.getElementById('promo-code-input').value = '';
        const fb = document.getElementById('promo-feedback');
        fb.classList.add('hidden');
        renderCartPage();
      }

      function applyPromoCode() {
        const input = document.getElementById('promo-code-input');
        const fb = document.getElementById('promo-feedback');
        const code = input.value.trim().toUpperCase();

        if (!code) {
          fb.className = 'text-[11px] font-semibold mb-3 text-red-600';
          fb.textContent = '❌ กรุณากรอกโค้ดส่วนลดก่อนกด Apply';
          fb.classList.remove('hidden');
          return;
        }

        if (!PROMO_CATALOG[code]) {
          fb.className = 'text-[11px] font-semibold mb-3 text-red-600';
          fb.textContent = '❌ ไม่พบโค้ด "' + code + '" ในระบบ';
          fb.classList.remove('hidden');
          return;
        }

        const collected = STATE.getVouchers();
        if (code !== 'BUY2GET1' && !collected.includes(code)) {
          STATE.setAppliedPromo('');
          fb.className = 'text-[11px] font-semibold mb-3 text-red-600 bg-red-50 border border-red-200 rounded-xl p-2.5';
          fb.innerHTML = '❌ คุณยังไม่ได้เก็บโค้ด <strong>' + code + '</strong>! กรุณาไปกดเก็บโค้ดที่ <a href="vouchers.html" class="underline font-extrabold text-[#ff6b00]">หน้าคูปองส่วนลด (Code Page)</a> ก่อนนำมาใช้งาน';
          fb.classList.remove('hidden');
          renderCartPage();
          return;
        }

        STATE.setAppliedPromo(code);
        const summary = STATE.calculateCartSummary();
        if (summary.promoError) {
          STATE.setAppliedPromo('');
          fb.className = 'text-[11px] font-semibold mb-3 text-red-600 bg-red-50 border border-red-200 rounded-xl p-2.5';
          fb.textContent = '⚠️ ' + summary.promoError;
          fb.classList.remove('hidden');
        } else {
          fb.className = 'text-[11px] font-semibold mb-3 text-green-700 bg-green-50 border border-green-200 rounded-xl p-2.5';
          fb.textContent = '✓ ใช้โค้ดส่วนลด ' + code + ' สำเร็จ! คำนวณยอดสุทธิใหม่เรียบร้อยแล้ว';
          fb.classList.remove('hidden');
        }
        renderCartPage();
      }

      function proceedToCheckout() {
        const summary = STATE.calculateCartSummary();
        if (summary.cart.length === 0) {
          alert('ตะกร้าสินค้ายังว่างอยู่ กรุณาเลือกสินค้าก่อนไปหน้าชำระเงิน');
          return;
        }
        window.location.href = 'checkout.html';
      }

      renderCartPage();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page — SPORT.CPE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f1f5f9] min-h-screen flex flex-col">

    
    <header class="bg-[#0b1329] text-white">
        <div class="max-w-[1280px] mx-auto px-6 h-[72px] flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-black text-xl tracking-wider text-white hover:opacity-90 italic">
                <img src="images/logo_sport_cpe.png" alt="SPORT.CPE Logo" class="w-9 h-9 object-contain shrink-0"> SPORT.CPE
            </a>
            <a href="index.html" class="text-[#ff6b00] hover:underline font-bold text-sm flex items-center gap-1.5">
                Back to Home →
            </a>
        </div>
    </header>
  

    <main class="flex-1 flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-[520px] bg-white rounded-3xl p-10 border border-slate-200/90 shadow-xl">
            <h1 class="text-2xl font-black text-center text-slate-900">Create Your Account</h1>
            <p class="text-center text-xs text-slate-400 mt-1 mb-6">มาสมัครสมาชิกกัน!</p>

            <div id="reg-alert" class="hidden mb-4 p-3.5 rounded-xl text-xs font-semibold border"></div>

            <form id="register-form" onsubmit="handleRegisterSubmit(event)" novalidate class="space-y-3.5 text-xs font-semibold text-slate-700">
                <div>
                    <label class="block mb-1 text-slate-800">Full Name</label>
                    <input type="text" id="reg-name" class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:border-[#0b1329]">
                </div>

                <div>
                    <label class="block mb-1 text-slate-800">Email Address</label>
                    <input type="email" id="reg-email" class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:border-[#0b1329]">
                </div>

                <div>
                    <label class="block mb-1 text-slate-800">Phone Number <span class="text-[11px] font-normal text-slate-400">(ตัวเลข 10 หลัก ขึ้นต้นด้วย 0)</span></label>
                    <input 
                        type="tel" 
                        id="reg-phone" 
                        maxlength="10"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)"
                        placeholder="เช่น 0891234567"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:border-[#0b1329]"
                    >
                </div>

                <div>
                    <label class="block mb-1 text-slate-800">Password</label>
                    <div class="relative">
                        <input type="password" id="reg-password" class="w-full border border-slate-300 rounded-lg p-2.5 pr-10 text-slate-900 focus:outline-none focus:border-[#0b1329]">
                        <button type="button" onclick="toggleRegPass('reg-password', 'reg-eye-1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 focus:outline-none text-sm select-none">
                            <span id="reg-eye-1">👁️‍🗨️</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block mb-1 text-slate-800">Confirm Password</label>
                    <div class="relative">
                        <input type="password" id="reg-confirm" class="w-full border border-slate-300 rounded-lg p-2.5 pr-10 text-slate-900 focus:outline-none focus:border-[#0b1329]">
                        <button type="button" onclick="toggleRegPass('reg-confirm', 'reg-eye-2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 focus:outline-none text-sm select-none">
                            <span id="reg-eye-2">👁️‍🗨️</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block mb-1 text-slate-800">Address</label>
                    <input type="text" id="reg-address" class="w-full border border-slate-300 rounded-lg p-2.5 text-slate-900 focus:outline-none focus:border-[#0b1329]">
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full bg-[#0b1329] hover:bg-slate-800 text-white font-bold py-3.5 rounded-lg text-xs flex items-center justify-center gap-1.5 transition shadow-sm">
                        <span>Create Account →</span>
                    </button>
                </div>

                <div class="text-center text-slate-500 font-normal pt-2">
                    Already have an account? <a href="login.html" class="font-bold text-slate-900 hover:underline">Log in</a>
                </div>
            </form>
        </div>
    </main>

    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>
    <script>
      function toggleRegPass(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
          input.type = 'text';
          icon.textContent = '👁️';
        } else {
          input.type = 'password';
          icon.textContent = '👁️‍🗨️';
        }
      }

      function showRegError(msg) {
        const box = document.getElementById('reg-alert');
        box.className = 'mb-4 p-3.5 rounded-xl text-xs font-semibold border bg-red-50 border-red-300 text-red-700';
        box.innerHTML = msg;
      }

      async function handleRegisterSubmit(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim().toLowerCase();
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;
        const address = document.getElementById('reg-address').value.trim();

        if (!name || !email || !phone || !password || !confirm || !address) {
          return showRegError('❌ กรุณากรอกข้อมูลให้ครบทั้ง 6 ช่อง');
        }
        if (!STATE.isValidEmail(email)) {
          return showRegError('❌ รูปแบบอีเมลไม่ถูกต้อง กรุณากรอกอีเมลให้ถูกต้อง (เช่น example@domain.com)');
        }
        if (!STATE.isValidPhone(phone)) {
          return showRegError('❌ เบอร์โทรศัพท์ไม่ถูกต้อง! กรุณากรอกเป็นตัวเลข 10 หลัก และขึ้นต้นด้วยเลข 0 เท่านั้น (เช่น 0891234567)');
        }
        if (password.length < 6) {
          return showRegError('❌ รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร');
        }
        if (password !== confirm) {
          return showRegError('❌ รหัสผ่าน (Password) และยืนยันรหัสผ่าน (Confirm Password) ไม่ตรงกัน');
        }

        const users = STATE.getUsers();
        if (users.some(u => u.email.toLowerCase() === email)) {
          return showRegError('❌ อีเมล <strong>' + email + '</strong> มีอยู่ในระบบแล้ว! กรุณาใช้บัญชีนี้เข้าสู่ระบบที่หน้า <a href="login.html" class="underline font-extrabold">Log in</a>');
        }

        // Insert directly into MySQL database (sport_cpe_db.users)
        let createdUser = {
          user_id: users.length + 1,
          name,
          email,
          password,
          phone,
          address,
          role: 'customer',
          member_since: 'Nov 2026'
        };

        try {
          const resp = await fetch('/api/db/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, phone, address })
          });
          const data = await resp.json();
          if (!resp.ok || !data.ok) {
            return showRegError('❌ ' + (data.error || 'ไม่สามารถบันทึกข้อมูลลงฐานข้อมูลได้'));
          }
          if (data.user) {
            createdUser = data.user;
          }
        } catch (err) {
          console.warn('Fallback to local user registration:', err);
        }

        users.push(createdUser);
        STATE.saveUsers(users);

        window.location.href = 'login.html?registered=1';
      }
    </script>
</body>
</html>
